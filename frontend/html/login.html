<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-container">

        <section class="login-box">

            <h1>Login</h1>

            <p class="subtitulo">
                Acesse sua conta
            </p>


            <form id="loginForm">

                <!-- E-MAIL -->
                <div class="form-group">

                    <label for="email">
                        Usuário
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="username"
                        required
                    >

                    <small
                        id="erroEmail"
                        class="erro">
                    </small>

                </div>


                <!-- SENHA -->
                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="senha-box">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            minlength="6"
                            maxlength="6"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarSenha"
                            class="botao-senha"
                        >
                            👁
                        </button>

                    </div>

                    <small
                        id="erroSenha"
                        class="erro">
                    </small>

                </div>


                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="botao-entrar"
                >
                    Entrar
                </button>


                <!-- MENSAGEM -->
                <p
                    id="mensagem"
                    class="mensagem">
                </p>

            </form>

        </section>

    </main>


    <script src="/js/login.js"></script>

</body>

</html>
